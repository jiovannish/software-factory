name: Jio task

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
        type: string
      agent:
        description: 'Coding agent'
        required: true
        type: choice
        options: [codex, claude]

permissions: {}

jobs:
  task:
    if: github.actor == 'saugardev' && github.triggering_actor == 'saugardev'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/factory.yml
    with:
      factory_ref: ${{ github.sha }}
      agent: ${{ inputs.agent || '' }}
      issue: ${{ inputs.issue || '' }}
    secrets:
      JIO_API_KEY: ${{ secrets.JIO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
